name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          echo "TAG_NAME=$TAG_NAME"
          sed -i "s/versionName = \".*\"/versionName = \"$TAG_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]\+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload artifact Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.APP_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          echo "TAG_NAME=$TAG_NAME"
          sed -i "s/versionName = \".*\"/versionName = \"$TAG_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]\+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts
          
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PAPP_KEY_FILE=release.keystore \
            -PAPP_KEYSTORE_PASSWORD=${{ secrets.APP_KEYSTORE_PASSWORD }} \
            -PAPP_KEYSTORE_ALIAS=${{ secrets.APP_KEYSTORE_ALIAS }} \
            -PAPP_KEY_PASSWORD=${{ secrets.APP_KEY_PASSWORD }}

      - name: Upload release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
